<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="trGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle with Racing Orange Fill -->
  <rect width="512" height="512" rx="110" fill="url(#trGradient)"/>

  <!-- Inner Deep Asphalt Core -->
  <rect x="28" y="28" width="456" height="456" rx="88" fill="#09090b"/>

  <!-- Precision Racing Orange Telemetry Border -->
  <rect x="38" y="38" width="436" height="436" rx="78" fill="none" stroke="#ea580c" stroke-width="5" stroke-opacity="0.9"/>
  <rect x="38" y="38" width="436" height="436" rx="78" fill="url(#innerGlow)"/>

  <!-- High-Performance "TR" Monogram -->
  <g id="monogram" transform="translate(256, 230)">
    <!-- T Letter -->
    <path d="M -150 -105 L -10 -105 L -10 -65 L -60 -65 L -60 90 L -100 90 L -100 -65 L -150 -65 Z" fill="#ffffff"/>
    
    <!-- R Letter -->
    <path d="M 0 -105 L 85 -105 C 125 -105 150 -85 150 -50 C 150 -25 135 -8 110 0 L 155 90 L 105 90 L 68 8 L 40 8 L 40 90 L 0 90 Z M 40 -65 L 40 -30 L 80 -30 C 98 -30 110 -38 110 -48 C 110 -58 98 -65 80 -65 Z" fill="#ffffff"/>
  </g>

  <!-- Dynamic Aerodynamic Speed Notch -->
  <polygon points="120,380 392,380 366,400 94,400" fill="#ea580c"/>
  <polygon points="405,380 435,380 415,400 385,400" fill="#ffffff" fill-opacity="0.9"/>
</svg>
